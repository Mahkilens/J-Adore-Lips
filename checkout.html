<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J'Adore Lips | Payments</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="favicon_io/favicon.ico" />
</head>
<body>
    <main class="checkout-container">
        <div class="checkout-left">
            <div class="checkout-header">
                <a class="checkout-back" href="index.html" aria-label="Back to home">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11.5L4.5 7L9 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Back
                </a>
                <a class="checkout-brand-link" href="index.html" aria-label="J'Adore Lips home">
                    <img src="images/Branding-removebg-preview.png" alt="J'Adore Lips">
                </a>
            </div>
            <form action="#" method="post" onsubmit="return false;">

                <section class="co-section" aria-label="Contact">
                    <h2 class="co-section-title">Contact</h2>
                    <div class="co-field-group">
                        <div class="co-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                        </div>
                        <div class="co-field">
                            <label for="phone">Phone <span class="co-optional">(optional)</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" autocomplete="tel">
                        </div>
                    </div>
                </section>

                <section class="co-section" aria-label="Delivery">
                    <h2 class="co-section-title">Delivery</h2>
                    <div class="co-field-group">
                        <div class="co-field co-field--full">
                            <label for="country">Country / Region</label>
                            <select id="country" name="country" autocomplete="country-name" required>
                                <option value="US" selected>United States</option>
                            </select>
                        </div>
                        <div class="co-field">
                            <label for="fname">First name</label>
                            <input type="text" id="fname" name="fname" required autocomplete="given-name">
                        </div>
                        <div class="co-field">
                            <label for="lname">Last name</label>
                            <input type="text" id="lname" name="lname" required autocomplete="family-name">
                        </div>
                        <div class="co-field co-field--full">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" placeholder="Street address" required autocomplete="street-address">
                        </div>
                        <div class="co-field co-field--full">
                            <label for="address2">Apt, suite, etc. <span class="co-optional">(optional)</span></label>
                            <input type="text" id="address2" name="address2" autocomplete="address-line2">
                        </div>
                        <div class="co-field co-field--full">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" required autocomplete="address-level2">
                        </div>
                        <div class="co-field">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state" required autocomplete="address-level1">
                        </div>
                        <div class="co-field">
                            <label for="zip">ZIP code</label>
                            <input type="text" id="zip" name="zip" required autocomplete="postal-code">
                        </div>
                    </div>
                </section>

                <div class="co-submit">
                    <button type="submit" class="co-pay-btn">Pay now &mdash; $34.99</button>
                    <p class="co-submit-note">By completing your purchase you agree to our <a href="#">Terms of Service</a>.</p>
                </div>

            </form>
        </div>

        <aside class="checkout-right" aria-label="Order summary">
            <h2 class="order-summary-title">Order Summary</h2>

            <div class="order-item" data-item-id="lip-plumper-001">
                <div class="order-item-thumb">
                    <div class="order-item-img-wrap">
                        <img src="images/Products.PNG" alt="J'Adore Lips Lip Plumper">
                    </div>
                    <span class="order-item-qty">1</span>
                </div>
                <div class="order-item-info">
                    <p class="order-item-name">J'Adore Lips Lip Plumper</p>
                    <p class="order-item-variant">Signature Formula &middot; 30ml</p>
                </div>
                <p class="order-item-price">$34.99</p>
                <button class="order-item-remove" type="button" aria-label="Remove item">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div class="order-discount">
                <input type="text" placeholder="Discount code" aria-label="Discount code">
                <button type="button">Apply</button>
            </div>

            <div class="order-divider"></div>

            <div class="order-row">
                <span>Subtotal</span>
                <span>$34.99</span>
            </div>
            <div class="order-row">
                <span>Shipping</span>
                <span class="order-shipping-note">Calculated at next step</span>
            </div>

            <div class="order-total">
                <span>Total</span>
                <span class="order-total-amount">$34.99</span>
            </div>

            <!--Waiting on client to add the product on shopify-->

        </aside>
    </main>

    <script src="js/cart.js"></script>
</body>
</html>
